<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark light" />
    <title>Atlas</title>
    <!-- the tab's icon (packaging/icon/favicon.svg); ico for browsers without SVG icons; the app icon for a home screen -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint so there is no dark/light flash.
      try { const t = localStorage.getItem("atlas.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
      // an e-ink screen in the app: black on white from the first paint, the settings still loading (or unreachable)
      try { if (window.AtlasNative && AtlasNative.eink() === "true") { document.documentElement.classList.add("eink"); document.documentElement.dataset.theme = "light"; } } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
