<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Atlas capture</title>
    <script>
      // Apply the saved theme before first paint so there is no dark/light flash.
      try { const t = localStorage.getItem("atlas.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/capture-main.ts"></script>
  </body>
</html>
