# Export a note: "Export…" opens a dialog with the options beside a preview. PDF through Typst (in Atlas's core: fast,
# no TeX) or through LaTeX (latexmk), LaTeX or Typst source, Word; pandoc writes each format. A paper linked as
# [[citekey]] is cited from the vault's .bib; ```tikz pictures are drawn by the LaTeX road, ```typst ones by both.
# Copy into a vault's .atlas/plugins/. The settings are the dialog's starting choices; the dialog saves them back.
title = "Export"
description = "a note to PDF (Typst or LaTeX), LaTeX, Typst or Word, in a dialog with a preview"
icon = "file"
version = "1.0.0"
api = 20
provides = ["pdf-export"]           # Print asks for a note's PDF by this role, not by this id

[permissions]
exec = ["pandoc", "latexmk"]       # run by the core (atlas.exec)

[helper]
js = "helper.js"                   # run in the core (QuickJS), built from helper/helper.ts
idle = "10m"                       # it only answers: stopped when unused, started again by the next call

[[setting]]
key = "format"
label = "Format"
kind = "choice"
choices = ["pdf-typst", "pdf-latex", "tex", "typ", "docx"]
default = "pdf-typst"
hint = "pdf-typst: PDF through Typst (no TeX needed); pdf-latex: PDF through latexmk; tex, typ: the source; docx: Word"

[[setting]]
key = "folder"
label = "Exports folder"
kind = "text"
default = "exports"
hint = "where exports go, under the note's own path (notes/a/x.md → exports/notes/a/x.pdf)"

[[setting]]
key = "openAfter"
label = "Open the export when done"
kind = "toggle"
default = true

[[setting]]
key = "toc"
label = "Table of contents"
kind = "toggle"
default = false
group = "Document"

[[setting]]
key = "numbered"
label = "Numbered sections"
kind = "toggle"
default = false
group = "Document"

[[setting]]
key = "paper"
label = "Paper"
kind = "choice"
choices = ["a4", "letter"]
default = "a4"
group = "Page"

[[setting]]
key = "fontsize"
label = "Font size"
kind = "choice"
choices = ["10pt", "11pt", "12pt"]
default = "11pt"
group = "Page"

[[setting]]
key = "margins"
label = "Margins"
kind = "choice"
choices = ["narrow", "normal", "wide"]
default = "normal"
group = "Page"

[[setting]]
key = "columns"
label = "Columns"
kind = "number"
default = 1
group = "Page"

[[setting]]
key = "lang"
label = "Language"
kind = "text"
default = "en"
hint = "the document's language (hyphenation, \"Contents\", \"References\"): en, fr, es…"
group = "Page"

[[setting]]
key = "font"
label = "Font"
kind = "text"
hint = "a font installed on the machine running Atlas; empty: the format's own (Libertinus for Typst, Latin Modern for LaTeX)"
group = "Page"

[[setting]]
key = "bibliography"
label = "Bibliography"
kind = "text"
hint = "the .bib the citations come from; empty: refs/refs.bib, else the one .bib at the top or in refs/"
group = "References"

[[setting]]
key = "style"
label = "Citation style"
kind = "choice"
choices = ["numeric", "author-year", "alphabetic", "physics"]
default = "numeric"
group = "References"

[[setting]]
key = "engine"
label = "LaTeX engine"
kind = "choice"
choices = ["lualatex", "xelatex", "pdflatex"]
default = "lualatex"
hint = "what latexmk compiles with; lualatex and xelatex read any Unicode in the note"
group = "LaTeX"

[[setting]]
key = "preamble"
label = "LaTeX preamble"
kind = "text"
hint = "a .tex of the vault \\input before every LaTeX export (packages, macros): e.g. templates/preamble.tex"
group = "LaTeX"

[[setting]]
key = "typstPreamble"
label = "Typst preamble"
kind = "text"
hint = "a .typ of the vault put before every Typst export (set and show rules): e.g. templates/style.typ"
group = "Typst"

# where it runs (PLUGIN-API.md, "Platforms"); a platform not named is untested (Android: only with `phone = true`)
[platforms]
linux = "works"
