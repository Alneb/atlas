# Audiobookshelf for the catalog. The user's
# own Audiobookshelf server: a book catalogued anywhere is looked up there (by ISBN, else by its exact title) and its
# note gets the narrator, the listening time and a link to the audiobook; `sync` files the server's whole library as
# book notes, a slice each run. The server and its API token are this vault's settings; nothing is asked without them.
title = "Catalog · Audiobookshelf"
description = "your Audiobookshelf audiobooks as book notes, and the audiobook beside any book you catalogue"
icon = "book"
version = "0.1.0"
api = 4
requires = ["catalog"]

[permissions]
net = ["*"]
secrets = true

[[setting]]
key = "server"
label = "Audiobookshelf address"
kind = "text"
hint = "https://abs.example.org — the address you open Audiobookshelf at"

[[setting]]
key = "token"
label = "API token"
kind = "secret"
hint = "Audiobookshelf → Settings → API Keys → Add (newer versions), or Settings → Users → your user → API token (older ones)"

[[setting]]
key = "finished"
label = "Shelf for finished audiobooks"
kind = "text"
default = "[[read]]"
hint = "the status a book you finished listening to gets (as your vault writes it); empty: left as it is"

[helper]
run = "python3 -u \"$ATLAS_PLUGIN_DIR/helper.py\""

[[tool]]
name = "lookup"
description = "A book's audiobook on the user's Audiobookshelf: narrator, listening time, the link to it (and the book's own details when Open Library has none)."
input = { kind = "string", ids = "object?", url = "string?", hints = "object?" }
secrets = ["token"]

[[tool]]
name = "sync"
description = "File the user's Audiobookshelf library as book notes (narrator, listening time, link; finished ones on the finished shelf). A slice each run; remembers what it filed."
input = { all = "boolean?" }
timeout_secs = 300
schedule = "every 6h"
secrets = ["token"]

[contributes.catalog]
sources = [{ kind = ["book", "science_book"], tool = "lookup", priority = 40, needs = ["audiobookshelf", "isbn"] }]
