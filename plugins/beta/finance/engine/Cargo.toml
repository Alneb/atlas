[package]
name = "atlas-finance"
description = "The finance plugin's engine: the .fin journal (parser, lot booking, checks, reports), statement imports, the hledger export and the Paisa migration"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Built into the plugin's bin/<target>/finance by build.sh (static musl: the same file runs on the desktop and in the
# server's container, where Enable Banking syncs). The library half is what the tests and the helper share.
[lib]
name = "finance"
path = "src/lib.rs"

[[bin]]
name = "finance"
path = "src/main.rs"

[dependencies]
atlas-plugin = { path = "../../../../crates/atlas-plugin" }
serde_json = { workspace = true }
serde = { workspace = true }
regex = "1"
toml = "0.9"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
pdf_oxide = "0.3.78"
csv = "1"
calamine = { version = "0.36", default-features = false }
serde_yaml = "0.9"
unicode-normalization = "0.1"
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.22"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
rand = "0.8"
