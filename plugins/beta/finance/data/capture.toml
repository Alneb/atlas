# Currency words and symbols → the commodity.
[currencies]
"€" = "EUR"
"eur" = "EUR"
"euro" = "EUR"
"euros" = "EUR"
"$" = "USD"
"usd" = "USD"
"dollar" = "USD"
"dollars" = "USD"
"ca$" = "CAD"
"cad" = "CAD"
"$ca" = "CAD"
"£" = "GBP"
"gbp" = "GBP"
"chf" = "CHF"

[words]
# Money coming in (else a capture is a payment): a leading "+" says it too.
income = ["salary", "sueldo", "nomina", "salaire", "paie", "ingreso", "cobro", "income", "refund", "reembolso", "remboursement", "devolucion"]
# Words between the others that say nothing about the payment ("café con Ana": "con").
filler = ["con", "with", "avec", "en", "at", "a", "de", "del", "for", "para", "pour", "the", "el", "la", "le", "les", "los", "las", "un", "una", "une", "y", "and", "et", "on", "el", "por", "paid", "pague", "pagado", "paye"]
