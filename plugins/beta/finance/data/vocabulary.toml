# Kinds of shop and service, for a payee the history has never seen (engine/src/classify.rs, the third layer).
# `words` are matched on the payee's words with accents and case folded: a word of five letters or more is a
# beginning ("supermar" matches SUPERMARCHE), a shorter one the whole word ("bell" is not BELLEVILLE), several words a
# phrase. `category` is matched against the ledger's own categories by its last parts, so "Food:Groceries" files
# into whatever account of the ledger ends that way, and is made under Expenses only when none does. `income = true`
# kinds apply to money coming in. A guess from here is a suggestion: Review shows it, the history and the user's rules
# outrank it.

# Words banks use for moving money (between one's own accounts among others), in the user's languages: two rows days
# apart on two of the user's accounts are paired as one transfer only when the text says so, with one of these or the
# other account's name (engine/src/statement/plan.rs). Matched anywhere in the text, accents and case folded.
transfer_words = ["transfer", "transf", "traspaso", "trasp", "recarga", "top-up", "topup", "money added", "virement", "deposit"]

# Words for money sent to or received from another person (Revolut's "Payment from …", Bizum): such a transfer waiting in
# a holding account is guessed to be a share of the nearest card payment before it (engine/src/classify.rs, `shared`).
person_words = ["transfer to", "transfer from", "payment from", "payment to", "bizum", "transferencia a", "transferencia de", "virement de", "virement a"]

# Words for a currency exchange inside one multi-currency account (Revolut's "Exchanged to CAD"): the row in one currency
# and the row in the other, a day apart at most, are one transaction with its price (`250.00 CAD @@ 157.69 EUR`).
exchange_words = ["exchanged", "exchange", "cambio de divisa", "conversion", "change de devise", "currency"]

# Where a movement waits for its other side besides Expenses:Unknown (the Paisa migration's parked transfers): a later
# statement that shows that side completes the transaction in place instead of adding a second one.
holding_accounts = ["Assets:Transfers"]

