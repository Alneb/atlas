# Banks' own sites, for "Fetch from the bank's site" (Finance → Sources): the page opens in your browser, you download
# the statement as usual, and every file that lands in the downloads folder and that a preset recognises is moved
# into the statements inbox (engine/src/main.rs `downloads`). No password and no page selector here: nothing to break
# when a site changes. A vault's finance/banks.toml replaces this list.

# Examples only: put your own banks in your vault's finance/banks.toml.
[[bank]]
name = "Example Bank"
url = "https://bank.example.org/"
hint = "Accounts → Statements → CSV"

[[bank]]
name = "Example Card"
url = "https://card.example.org/"
hint = "Card → Transactions → Export (OFX or CSV)"
