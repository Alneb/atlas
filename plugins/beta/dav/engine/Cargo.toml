[package]
name = "atlas-dav"
description = "The Calendar (DAV) plugin's engine: a local cache of CalDAV calendars and ICS subscriptions, recurrence and time zones, editing, quick add, invitations and CardDAV contacts"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["alneb <16853434+alneb@users.noreply.github.com>"]
repository = "https://github.com/Alneb/atlas"
publish = false

# Its own workspace (not a member of Atlas's): the TLS stack stays out of the core's lock file and build.
# Built static (x86_64-unknown-linux-musl) into ../bin/<target>/ by build.sh. Unlike the catalog, the network is the
# helper's own (reqwest): CalDAV needs PROPFIND/REPORT with Basic auth, and the tools must work under `atlas mcp` with
# no Atlas window serving the vault (the core's fetch answers 503 then).
[workspace]

[[bin]]
name = "dav"
path = "src/main.rs"

[lib]
name = "atlas_dav"
path = "src/lib.rs"

[dependencies]
atlas-plugin = { path = "../../../../crates/atlas-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono-tz = "0.10"
rrule = "0.14"
# WebDAV Push (push.rs): the subscription's P-256 key, random topics and secrets
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "std"] }
getrandom = "0.2"

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
