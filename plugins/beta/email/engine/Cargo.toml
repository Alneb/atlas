[package]
name = "atlas-email"
description = "The Email plugin's engine: IMAP sync into a local index, parsing, threading, rendering, sending, rules and saved notes"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Built into the plugin's bin/<target>/email by build.sh (static musl, like finance). The library half is what the
# tests and the helper share.
[lib]
name = "email"
path = "src/lib.rs"

[[bin]]
name = "email"
path = "src/main.rs"

[dependencies]
atlas-plugin = { path = "../../../../crates/atlas-plugin" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
futures = "0.3"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
mail-parser = { version = "0.11", features = ["full_encoding"] }
mail-builder = "1"
ammonia = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
regex = "1"

[dev-dependencies]
tempfile = "3"
