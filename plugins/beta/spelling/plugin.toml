# Spelling: a wavy line under a word of a note's prose that neither the language's dictionary nor the vault knows.
# The dictionaries are the machine's Hunspell ones (en, es, fr, de… as installed); a word the vault uses often enough
# counts as right; right-click a marked word for suggestions or to add it to the vault's words. README.md.
title = "Spelling"
description = "marks misspelled words in notes, from the machine's dictionaries and the vault's own words"
icon = "check"
version = "0.4.2"
api = 22
phone = true

[permissions]
exec = ["ls", "cat", "base64"]               # find and read the Hunspell dictionaries (/usr/share/hunspell)

[helper]
js = "helper.js"                   # run in the core (QuickJS), built from helper/helper.ts
idle = "10m"

# The languages: chosen in Settings → Spelling's own section ("Languages and words"), from the installed dictionaries,
# so these three are never typed (hidden in the form; that section writes them).
[[setting]]
key = "languages"
label = "Languages checked"
kind = "list"
hidden = true
hint = "the languages a note may be in (en, es…); absent: English, Spanish, French and German as installed"

[[setting]]
key = "language"
label = "Main language"
kind = "text"
hidden = true
default = ""
hint = "a note's language when its text says too little and it has no lang: property; empty: the first checked"

[[setting]]
key = "dictionaries"
label = "Dictionaries"
kind = "text"
hidden = true
default = ""
hint = "a language's variant other than the usual, e.g. en=en_GB, es=es_MX"

[[setting]]
key = "min_uses"
label = "Learn a word used this often"
kind = "number"
default = 3
hint = "a word no dictionary has counts as right once the vault uses it this many times (a name, a term of your field)"

[[setting]]
key = "min_notes"
label = "…in this many notes"
kind = "number"
default = 2
hint = "and in at least this many different notes: a typo repeated inside one note is never learned"

[[setting]]
key = "folder"
label = "Dictionary folder"
kind = "text"
default = ""
hint = "a folder of .aff/.dic pairs searched after the vault's .atlas/dictionaries and before /usr/share/hunspell"

[[setting]]
key = "keep_in_vault"
label = "Keep the dictionaries in the vault"
kind = "toggle"
default = true
hint = "copy the dictionaries in use into .atlas/dictionaries (about 1 MB a language), so the server and the phone, which have none of their own, check spelling too"

# where it runs (PLUGIN-API.md, "Platforms"): used daily on Linux; Android with `phone = true`
[platforms]
linux = "works"
