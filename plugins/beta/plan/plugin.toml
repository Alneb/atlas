# Plan: nudges for open tasks at the moment they fit (docs/design/DESIGN-calendar-tasks-nudges.md §3). The core rings
# them as planned notices with Done / Snooze / Open; this plugin decides which task, when and why, and keeps the
# ledger of what happened (plan/ledger/<month> <device>.md). README.md has the rules and the formula.
title = "Plan"
description = "nudges for your tasks when they fit your day, with Done / Snooze / Open; habits nagged in their window until done"
icon = "bell"
version = "0.11.1"
api = 28
needs = ">=0.3.0"          # the first core that reads `background` (older ones refuse the key); on a core without hooks the ntfy nudges go without buttons
phone = true

[helper]
js = "helper.js"                  # TypeScript in helper/, run in the core (QuickJS): the same on the phone

[[setting]]
key = "nudges"
label = "Nudges"
kind = "toggle"
default = true
hint = "a notification for a task when it fits your day; off: only the morning digest"

[[setting]]
key = "quiet"
label = "Quiet hours"
kind = "text"
default = "22:30-08:00"
hint = "no nudge between these times (HH:MM-HH:MM)"
group = "When"

[[setting]]
key = "quiet_measured"
label = "Quiet hours measured"
kind = "toggle"
default = false
hint = "use the quiet hours measured from when your devices were in use and tasks were ticked (once 14 days are known; Why now? below shows them) instead of the range above"
group = "When"

[[setting]]
key = "digest"
label = "Morning digest"
kind = "toggle"
default = true
hint = "one notification after the quiet hours: what is overdue, due today, and has no slot today"
group = "When"

[[setting]]
key = "digest_at"
label = "Digest not before"
kind = "text"
default = "08:00"
group = "When"

[[setting]]
key = "snooze_minutes"
label = "Snooze puts off at least (minutes)"
kind = "number"
default = 60
hint = "Snooze moves the nudge to the first free slot after this"
group = "When"

[[setting]]
key = "horizon"
label = "Days ahead"
kind = "number"
default = 7
hint = "a task dated within this many days (or overdue) may nudge; a ⏫ or 🔺 one always may"
group = "What counts"

[[setting]]
key = "stale"
label = "An undated task nudges after (days)"
kind = "number"
default = 2
hint = "a task with no date (a log's - [ ] line) may nudge once it has been open this long, within the daily budget; 0: never"
group = "What counts"

[[setting]]
key = "exclude"
label = "Folders left out"
kind = "text"
hint = "comma-separated; their tasks never nudge"
group = "What counts"

[[setting]]
key = "minutes"
label = "A task takes (minutes)"
kind = "number"
default = 30
hint = "unless its line says ⏱ 45m, or its tag has a duration below"
group = "What counts"

[[setting]]
key = "durations"
label = "Durations per tag"
kind = "text"
hint = "e.g. writing=60, admin=15 (minutes)"
group = "What counts"

[[setting]]
key = "threshold"
label = "Threshold"
kind = "number"
default = 1
hint = "lower: more nudges; higher: only the urgent ones (urgency × room, README)"
group = "Budget"

[[setting]]
key = "max_per_day"
label = "Nudges a day"
kind = "number"
default = 0
hint = "0: measured from what you acted on (6 until there are 14 days of ledger); important tasks do not count"
group = "Budget"

[[setting]]
key = "min_gap"
label = "Minutes between nudges"
kind = "number"
default = 0
hint = "0: measured (45 until there are 14 days of ledger)"
group = "Budget"

[[setting]]
key = "ntfy_fallback"
label = "Through ntfy when no device runs Atlas"
kind = "toggle"
default = true
group = "Elsewhere"
hint = "the server sends a nudge that comes due through the Notifications plugin's ntfy, with Done and Snooze buttons, while none of your devices runs Atlas (a vault with a server, mirrored)"

[[setting]]
key = "ntfy_text"
label = "Say the task on ntfy"
kind = "toggle"
default = false
group = "Elsewhere"
hint = "off: the message only says “A task is waiting”; the task's name and reasons stay on your devices"

[[setting]]
key = "server_url"
label = "Server's address for the buttons"
kind = "text"
group = "Elsewhere"
advanced = true
hint = "e.g. https://atlas.example.org; empty: as your devices reach the server"

[[setting]]
key = "ledger"
label = "Ledger folder"
kind = "text"
default = "plan/ledger"
hint = "a note per device and month: what was nudged, snoozed, done"
advanced = true

[[setting]]
key = "habits"
label = "Folder for new habits"
kind = "text"
default = "habits"
hint = "where `habit gym mon wed fri 18:00` in a capture makes its note; a note anywhere with a habit: property is one"
advanced = true

[[setting]]
key = "device"
label = "This device's name in the ledger"
kind = "text"
hint = "empty: the computer's name"
advanced = true

[[tool]]
name = "nudges"
description = "The coming nudges for open tasks (Atlas asks by itself, on = \"plan\")."
input = {}
on = "plan"

[[tool]]
name = "pressed"
description = "Done or Snooze pressed on a nudge, or Done / Skip today on a habit's nag (Atlas calls it, on = \"notice\")."
input = {}
on = "notice"

[[tool]]
name = "fallback"
description = "When no device of the person runs Atlas, send the nudges that come due through ntfy with Done / Snooze buttons (the server runs it by itself)."
input = {}
schedule = "every 5m"
background = "server"  # the ntfy fallback is for when no device of the person runs Atlas: only the always-on server can send it
timeout_secs = 60

[[tool]]
name = "press"
description = "Done or Snooze pressed on a nudge sent through ntfy (the button's signed address, on = \"hook\")."
input = {}
on = "hook"

[[tool]]
name = "capture"
description = "After every capture: a line `habit <kind> [days] [HH:MM | HH:MM-HH:MM]` (habit gym mon wed fri 18:00, habit sleep 23:30) makes the habit's note, once. Answers the note, or skipped."
input = { text = "string", path = "string?", line = "integer?" }
on = "capture"

[[tool]]
name = "explain"
description = "Why the user is (or is not) nudged: the day's budget as measured from the ledger (nudges a day, minutes between them), each open task's next nudge or the reason it has none, and the ledger's last lines. Read-only."
input = {}

# where it runs (PLUGIN-API.md, "Platforms"); a platform not named is untested (Android: only with `phone = true`)
[platforms]
linux = "works"
