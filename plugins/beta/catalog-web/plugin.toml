# Any web page for the catalog: what the page says about itself (title, author, date, cover, its kind — a film, a
# video, a paper — and the IDs it names) and its readable text, read by Atlas's core (POST /api/clip). No program of
# its own: a manifest is all it takes. A page that turns out to be a film or a video re-kinds the capture
# (docs/refactor/REFACTOR-catalog.md, "How it decides what a thing is").
title = "Catalog · Web pages"
description = "any web page into the catalog: its own metadata and readable text"
icon = "globe"
version = "0.1.0"
api = 4
requires = ["catalog"]

[contributes.catalog]
# for every kind: the page behind the link is one more (low-priority) source; the article kind lives on it
sources = [{ kind = "*", api = "/api/clip", priority = 10, needs = ["url"] }]

# where it runs (PLUGIN-API.md, "Platforms"); a platform not named is untested (Android: only with `phone = true`)
[platforms]
linux = "works"
