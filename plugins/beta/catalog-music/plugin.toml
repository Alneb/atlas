# Music for the catalog, with no key: albums, songs and artists from a Bandcamp, Spotify, Apple Music, Deezer, Tidal,
# Discogs, MusicBrainz or YouTube Music (album playlist) link. The page says what it is (catalog-web reads it); then
# MusicBrainz, the open music encyclopedia, gives the clean names, the first release year, genres, the label and the
# cover (Cover Art Archive), found by the link itself or by artist and title. Asked at most once a second, as it asks.
title = "Catalog · Music"
description = "albums, songs and artists from any music link, filled in by MusicBrainz"
icon = "music"
version = "0.1.0"
api = 4
requires = ["catalog"]

[permissions]
net = ["musicbrainz.org"]

[helper]
run = "python3 -u \"$ATLAS_PLUGIN_DIR/helper.py\""

[[tool]]
name = "lookup"
description = "An album's, song's or artist's details from MusicBrainz: by its MusicBrainz id, by the link it was captured from, or by the artist and title a page gave."
input = { kind = "string", ids = "object?", url = "string?", hints = "object?" }

[contributes.catalog]
recognize = [
  { pattern = "(?i)open\\.spotify\\.com/(?:intl-[a-z]+/)?album/(\\w+)", kind = "album", id = "spotify" },
  { pattern = "(?i)open\\.spotify\\.com/(?:intl-[a-z]+/)?track/(\\w+)", kind = "song", id = "spotify" },
  { pattern = "(?i)open\\.spotify\\.com/(?:intl-[a-z]+/)?artist/(\\w+)", kind = "artist", id = "spotify" },
  { pattern = "(?i)([\\w-]+\\.bandcamp\\.com/album/[\\w-]+)", kind = "album", id = "bandcamp" },
  { pattern = "(?i)([\\w-]+\\.bandcamp\\.com/track/[\\w-]+)", kind = "song", id = "bandcamp" },
  { pattern = "(?i)musicbrainz\\.org/release-group/([0-9a-f-]{36})", kind = "album", id = "musicbrainz" },
  { pattern = "(?i)musicbrainz\\.org/recording/([0-9a-f-]{36})", kind = "song", id = "musicbrainz" },
  { pattern = "(?i)musicbrainz\\.org/artist/([0-9a-f-]{36})", kind = "artist", id = "musicbrainz" },
  { pattern = "(?i)musicbrainz\\.org/release/([0-9a-f-]{36})", kind = "album", id = "mb_release" },
  { pattern = "(?i)music\\.apple\\.com/[a-z]{2}/album/[^\\s?]+/(\\d+)\\?(?:[^\\s]*&)?i=(\\d+)", kind = "song", id = "apple" },
  { pattern = "(?i)music\\.apple\\.com/[a-z]{2}/album/[^\\s?]+/(\\d+)(?:$|[^\\d?])", kind = "album", id = "apple" },
  { pattern = "(?i)deezer\\.com/(?:[a-z]{2}/)?album/(\\d+)", kind = "album", id = "deezer" },
  { pattern = "(?i)deezer\\.com/(?:[a-z]{2}/)?track/(\\d+)", kind = "song", id = "deezer" },
  { pattern = "(?i)tidal\\.com/(?:browse/)?album/(\\d+)", kind = "album", id = "tidal" },
  { pattern = "(?i)tidal\\.com/(?:browse/)?track/(\\d+)", kind = "song", id = "tidal" },
  { pattern = "(?i)discogs\\.com/(?:[\\w-]+/)?master/(\\d+)", kind = "album", id = "discogs" },
  { pattern = "(?i)music\\.youtube\\.com/playlist\\?list=(OLAK5uy_[\\w-]+)", kind = "album", id = "ytmusic_album" },
]
sources = [{ kind = ["album", "song", "artist"], tool = "lookup", priority = 65, needs = ["musicbrainz", "mb_release", "url"] }]
