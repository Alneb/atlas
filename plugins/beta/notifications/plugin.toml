# Notifications: what the server says, kept. Apprise is the hub (a server's services → Apprise → ntfy, mail…); this
# plugin reads the ntfy topics Apprise (or anything else) posts to, files each message in a note per source — the
# message's tag, else the topic — newest first, and can mute a source; it also sends to the phone (through Apprise
# when set, else ntfy) and turns what the phone sends to an inbox topic into captures. docs/design/DESIGN-notifications.md.
title = "Notifications"
description = "your server's notifications (ntfy, Apprise), a note per source"
phone = true
icon = "bell"
version = "0.7.0"
api = 19
needs = ">=0.3.2"          # the first core that reads a hook's `standing` (older ones refuse the key)
background = "server"  # the ntfy poll files notes: one poller (the server is the hub), not one per open device
# the ntfy plugin's sending and inbox are this plugin's: a vault that had it keeps its server, topics and token
[replaces]
ntfy = { rename = { topic = "phone_topic" } }

[helper]
js = "helper.js"                  # TypeScript in helper/, run in the core (QuickJS): no Python, on the phone too

[permissions]
net = ["*"]          # the ntfy server and the Apprise address are settings: any host
secrets = true       # the ntfy sign-in: a password or an access token

[[setting]]
key = "server"
label = "ntfy server"
kind = "text"
default = "https://ntfy.sh"

[[setting]]
key = "topics"
label = "Topics to keep"
kind = "text"
hint = "comma-separated; each message is filed under its first tag (Apprise's tag: backups, updates…), else the topic"

[[setting]]
key = "folder"
label = "Folder of the notes"
kind = "text"
default = "notifications"

[[setting]]
key = "phone_topic"
label = "Your phone's topic"
kind = "text"
hint = "what “Send to my phone” posts to when no Apprise address is set"

[[setting]]
key = "inbox"
label = "Topic to capture from"
kind = "text"
hint = "what you send to this topic from the phone is captured into today's log; empty: not read"

[[setting]]
key = "apprise"
label = "Apprise address"
kind = "text"
hint = "the Apprise API's notify address (…/notify/<key>): Atlas's own messages go out through it; empty: ntfy"

[[setting]]
key = "user"
label = "ntfy user"
kind = "text"
hint = "for a server that asks you to sign in (its own users, deny-all by default): your ntfy user name, with its password below; or leave it empty and give a token"

[[setting]]
key = "password"
label = "ntfy password"
kind = "secret"

[[setting]]
key = "token"
label = "ntfy access token"
kind = "secret"
hint = "instead of a user and password; empty for open topics"

[[tool]]
name = "sync"
description = "Read what arrived on the kept ntfy topics since the last time and file it in the notes, one per source; captures what the phone sent to the inbox topic."
input = {}
secrets = ["token", "password"]
schedule = "every 5m"
timeout_secs = 60

[[tool]]
name = "send"
description = "Send a short message to the user's phone (through Apprise when set, else their ntfy topic). Use it when the user asks to be told or reminded on their phone, e.g. when a long job ends."
input = { text = "string", title = { type = "string", description = "the notification's title (default: Atlas)", optional = true }, actions = { type = "array", description = "buttons, for other plugins: [{ label, url, method?, body? }], each press a request from the phone (a hook's address); sent through ntfy, which alone shows them (at most 3)", optional = true }, click = { type = "string", description = "the address a tap on the notification opens", optional = true } }
secrets = ["token", "password"]
timeout_secs = 40

[[tool]]
name = "apprise"
description = "A notification posted to a source's standing address (Apprise's jsons:// target, or any webhook alike), filed under that source."
input = {}
on = "hook"
standing = true          # Apprise posts to it for months: the address has no expiry; a newer one for the source replaces it
secrets = ["hook_nonces"]

[[tool]]
name = "apprise_address"
description = "Make the address Apprise (or any service) posts a source's notifications to: its jsons:// URL to paste into Apprise, tagged for that source. A new one replaces the source's older address."
input = { source = { type = "string", description = "the source's name: its note's (backups, updates…)" }, origin = { type = "string", description = "this server's https address, when Atlas has not seen it yet", optional = true } }
secrets = ["hook_nonces"]

# where it runs (PLUGIN-API.md, "Platforms"); a platform not named is untested (Android: only with `phone = true`)
[platforms]
linux = "works"
