[package]
name = "atlas-papers"
description = "The references library's helper (catalog-papers): entries as notes, add by DOI/arXiv, PDFs, refs.bib, the Zotero Connector (docs/refactor/REFACTOR-references-plugin.md)"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Built static (musl) into the plugin's bin/<target>/ by engine/build.sh, as the catalog's engine. The network goes
# through the core's plugin fetch (the plugin's `net` permissions), never from here (no reqwest, no tokio).
[[bin]]
name = "papers"
path = "src/main.rs"

[dependencies]
atlas-plugin = { path = "../../../../crates/atlas-plugin" }
atlas-text = { path = "../../../../crates/atlas-text" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
# the Zotero Connector's listener: a request's head parsed, served on std::net (no async runtime in the helper)
httparse = "1"

[dev-dependencies]
tempfile = "3"
