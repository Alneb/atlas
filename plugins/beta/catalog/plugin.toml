# The capture + organization meta plugin: anything captured (a link, an ID, a title) is recognised, looked up in every
# source the switched-on catalog-* plugins offer, written as one note of its kind and kept in step with the services
# that hold it (Linkwarden, Jellyfin, Zotero…). The work runs in its helper on the server; docs/REFACTOR-catalog.md.
title = "Catalog"                 # not "Library": the built-in Library tile is the page its libraries are tabs of
rail = false                # one Library: its kinds are tabs of the built-in Libraries page; the every-kind view (view.js →
                            # main.js catalog.app) stays a block and a command, not a second tile
description = "anything you capture, recognised, enriched and filed in its library"
phone = true # runs in the phone apps too (only plugins marked so start there)
icon = "grid" # not References' library icon (a vault may show both)
version = "0.6.0"
api = 19
provides = ["catalog"]                 # the role the core and the page ask for (not this id)

# Catalog · Web pages is now the "read_pages" setting: a vault that had it switched off gets the setting off
[replaces]
catalog-web = { if_off = { read_pages = false } }

[permissions]
net = ["*"] # the pages a link points to, read for the "read_pages" source (clip.rs: fetched through the core's fetch)

[helper]
# built by engine/build.sh: one static binary per platform
# (on the phone the app's own copy, from the APK: $ATLAS_PLUGIN_BIN — Android runs nothing from the vault)
run = "\"${ATLAS_PLUGIN_BIN:-$ATLAS_PLUGIN_DIR/bin/$ATLAS_PLUGIN_TARGET}/catalog\""
idle = "10m"                       # it only answers: stopped when unused, started again by the next call

[[tool]]
name = "add"
description = "Catalogue a link, DOI, arXiv id or other identifier: recognise what it is, gather metadata from every catalog source, and write (or update) its note in the right library (`note`: the existing note it is, chosen by the user — only its gaps are filled when it has no IDs yet; `kind` + `ids`: the thing a sync already knows, filed by those IDs even when the words find it no more). Returns the note's path, what was done and each step."
input = { text = "string", kind = "string?", ids = "object?", own = "object?", note = "string?" }
timeout_secs = 120

[[tool]]
name = "capture"
description = "After every capture (any app): a link or identifier in it is catalogued as add does; plain words are left alone (no search). Answers the note, or skipped."
input = { text = "string", path = "string?", line = "integer?" }
timeout_secs = 120
on = "capture"

[[setting]]
key = "read_pages"
label = "Read the page a link points to"
kind = "toggle"
default = true
hint = "what a web page says about itself (title, author, date, cover, its kind, the IDs it names) and its readable text, a source for every kind; off: a link is filed from its address and the other sources only"

[[setting]]
key = "on_capture"
label = "File links from every capture"
kind = "toggle"
default = true
hint = "a link, DOI, ISBN or IMDb id captured anywhere (the capture box, the phone, the desktop, an agent) becomes its note in its library, and the capture links to it"

[[tool]]
name = "preview"
description = "What `add` would do with this text, without writing anything: the recognised kind, the merged metadata, where the note would go or the note that already holds it."
input = { text = "string", kind = "string?", ids = "object?", note = "string?" }
timeout_secs = 120

[[tool]]
name = "recognize"
description = "Which kinds of thing this text could be (film, paper, video, web page…) and the identifiers found, without asking any service."
input = { text = "string" }

[[tool]]
name = "refresh"
description = "Fetch a catalogued note's metadata again and update the properties the catalog owns (never the user's text)."
input = { path = "string" }
timeout_secs = 120

[[tool]]
name = "kinds"
description = "The kinds of thing the catalog knows in this vault, where each one's library is and where it was declared."
input = {}

# where it runs (PLUGIN-API.md, "Platforms"); a platform not named is untested (Android: only with `phone = true`)
[platforms]
linux = "works"
