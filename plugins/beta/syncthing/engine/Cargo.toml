[package]
name = "atlas-syncthing"
description = "The Syncthing plugin's helper: the vault's changed paths handed to this computer's Syncthing to scan at once"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Built into the plugin's bin/<target>/syncthing by build.sh (static musl). Syncthing is reached through the core's
# fetch (`[permissions] net`), so the helper needs no HTTP stack of its own.
[lib]
name = "syncthing"
path = "src/lib.rs"

[[bin]]
name = "syncthing"
path = "src/main.rs"

[dependencies]
atlas-plugin = { path = "../../../../crates/atlas-plugin" }
serde_json = { workspace = true }
