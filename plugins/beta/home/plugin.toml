# Home's niceties: in Today's greeting the week and the moon and what is due; and `home.map`, a
# block that gives the vault its skeleton — the notes others hang from (their `topics:`), as a tree, each with how many
# notes name it ("something that vertebrates the whole base"). Everything is read from the notes; nothing is written.
title = "Home"
description = "the greeting's week, moon and what is due; a map of the vault's topics (home.map)"
icon = "today"
version = "0.2.0"
api = 4
phone = true

[[setting]]
key = "language"
label = "Language"
kind = "choice"
choices = ["auto", "en", "es"]
default = "auto"
hint = "auto: this device's language"

[[setting]]
key = "by"
label = "Map: the property notes hang from"
kind = "text"
default = "topics"
hint = "the links that make the vault's tree (topics, up, parent…)"
