# Rnote → Excalidraw: opening an .rnote turns it into an .excalidraw beside it and opens that. Runs in the page: any device, no Rnote needed.
title = "Rnote"
description = "open .rnote files as Excalidraw drawings: each is converted once, beside it (pen pressure, shapes, text, pictures); the .rnote stays"
icon = "edit"
version = "0.4.0"
api = 7
# a click on an .rnote opens this plugin's view (view.js), which converts it and opens the drawing in its place
claims = ["*.rnote"]

# where it runs (PLUGIN-API.md, "Platforms"); a platform not named is untested (Android: only with `phone = true`)
[platforms]
linux = "works"
