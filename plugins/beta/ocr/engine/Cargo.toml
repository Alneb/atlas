[package]
name = "atlas-ocr"
description = "The OCR plugin's helper: a screenshot's text read on this machine (Tesseract), kept under its capture and handed to the catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Built into the plugin's bin/<target>/ by build.sh, like the catalog's engine. Tesseract and Leptonica are compiled
# into it (kreuzberg-tesseract, static); each language's model (a few MB) is fetched once through the core into the
# plugin's cache; nothing leaves the machine after that.
[[bin]]
name = "ocr"
path = "src/main.rs"

[dependencies]
atlas-plugin = { path = "../../../../crates/atlas-plugin" }
serde_json = { workspace = true }
kreuzberg-tesseract = "4.10.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
