# Books for the catalog, with no key: an ISBN (typed, pasted, or on a Goodreads page), an Open Library link, or a
# Goodreads link. Open Library gives the title, the authors, the first year, the pages, the publisher, subjects as
# genres, the description and the cover. A book whose subjects are physics, mathematics, a science or a textbook (never
# science fiction) is a science book, kept in its own library.
title = "Catalog · Books"
description = "books by ISBN, Open Library or Goodreads, filled in by Open Library"
icon = "book"
version = "0.1.0"
api = 4
requires = ["catalog"]

[permissions]
net = ["openlibrary.org"]

[helper]
run = "python3 -u \"$ATLAS_PLUGIN_DIR/helper.py\""

[[tool]]
name = "lookup"
description = "A book's details from Open Library by ISBN or Open Library id: title, authors, year, pages, publisher, subjects, description, cover."
input = { kind = "string", ids = "object?", url = "string?", hints = "object?" }

[contributes.catalog]
recognize = [
  { pattern = "(?i)\\bISBN(?:-1[03])?:?\\s*([\\dX](?:[\\d\\- ]{8,15})[\\dX])\\b", kind = "book", id = "isbn" },
  { pattern = "(?:^|[^\\d-])(97[89](?:-?\\d){10})(?:$|[^\\d-])", kind = "book", id = "isbn" },
  { pattern = "(?i)openlibrary\\.org/works/(OL\\d+W)", kind = "book", id = "openlibrary" },
  { pattern = "(?i)openlibrary\\.org/books/(OL\\d+M)", kind = "book", id = "ol_edition" },
  { pattern = "(?i)goodreads\\.com/(?:[a-z]+/)?book/show/(\\d+)", kind = "book", id = "goodreads" },
]
sources = [{ kind = ["book", "science_book"], tool = "lookup", priority = 65, needs = ["isbn", "openlibrary", "ol_edition", "goodreads"] }]

# where it runs (PLUGIN-API.md, "Platforms"); a platform not named is untested (Android: only with `phone = true`)
[platforms]
linux = "works"
