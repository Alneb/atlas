[package]
name = "atlas-claude"
description = "The Claude plugin's helper: the plan's usage of the Claude Code accounts on this computer, and the suggestions of its settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Built into the plugin's bin/<target>/claude by build.sh. It reads Claude Code's own files outside the vault (the
# credentials, each account's address, the session hooks' cache), which a JavaScript helper cannot; the usage endpoint
# is asked through the core's fetch (`[permissions] net`), so it needs no HTTP stack of its own.
[lib]
name = "claude"
path = "src/lib.rs"

[[bin]]
name = "claude"
path = "src/main.rs"

[dependencies]
atlas-plugin = { path = "../../../../crates/atlas-plugin" }
serde_json = { workspace = true }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
