# Predictor: the likely rest of the word being typed, and the next word when the vault is sure of it, faint after the
# caret; learned from the vault's notes, per language. Tab or → at the end of a line takes it, Ctrl+→ one word.
# Never in math, code or a .tex file. README.md.
title = "Predictor"
description = "suggests the rest of a word and the next one as you write, learned from the vault"
icon = "sparkles"
version = "0.3.0"
api = 22
phone = true

[helper]
js = "helper.js"                   # run in the core (QuickJS), built from helper/helper.ts
idle = "10m"

[permissions]
exec = ["ls", "cat"]               # find and read the Hunspell dictionaries (/usr/share/hunspell), for finishing words

[[setting]]
key = "min_count"
label = "Uses before a guess"
kind = "number"
default = 3
hint = "how often the vault must write a word before it counts as one of its words (the open note's words count at once)"

[[setting]]
key = "next_word"
label = "Next word"
kind = "toggle"
default = true
hint = "after a space, and after a completed word, the next word when the vault is sure of it"

[[setting]]
key = "general"
label = "Common words of the language"
kind = "toggle"
default = true
hint = "rank words by how often the language writes them (English and Spanish lists, from wordfreq), under the vault's own"

[[setting]]
key = "dictionary"
label = "Dictionary words"
kind = "toggle"
default = true
hint = "finish a word the vault seldom writes from the language's Hunspell dictionary (from three letters, when few words start so)"

[[setting]]
key = "language"
label = "Main language"
kind = "text"
default = "en"
hint = "a note's language when its text says too little and it has no lang: property"

[[setting]]
key = "delay"
label = "Delay (ms)"
kind = "number"
default = 60
hint = "the pause after a key before a guess shows"
