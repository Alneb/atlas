[package]
name = "atlas-ssh"
description = "The SSH plugin's helper: long-lived shells on the user's hosts for agents and the page, the Files pane over sftp, one shared OpenSSH connection per host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# OpenSSH does the connecting (ssh, sftp, ControlMaster): this is the bookkeeping around it, in place of session.py,
# sftp.py and hosts.py. Built static (musl) into the plugin's
# bin/<target>/ by build.sh; no async runtime, a thread per call (atlas_plugin::serve_threads).
[[bin]]
name = "atlas-ssh"
path = "src/main.rs"

[dependencies]
atlas-plugin = { path = "../../../../crates/atlas-plugin" }
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
