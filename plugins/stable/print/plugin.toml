# Print through CUPS: "Print" in the file tree's and the tab's menus, and a command. A note prints as the document the
# Export plugin makes of it (its PDF), any other file as it is; the job id or the reason it failed is shown in a notice.
# Needs CUPS (lp, lpstat) on the machine running Atlas. Copy into a vault's .atlas/plugins/.
title = "Print"
description = "print a file, or a note as its exported PDF, with CUPS (lp)"
icon = "file"
version = "0.2.0"
api = 9

[helper]
run = "python3 -u \"$ATLAS_PLUGIN_DIR/helper.py\""

[[setting]]
key = "printer"
label = "Printer"
kind = "text"
suggest = "printers"
hint = "the printers CUPS knows are offered below the box; empty: the default printer"

[[setting]]
key = "copies"
label = "Copies"
kind = "number"
default = 1

[[setting]]
key = "sides"
label = "Sides"
kind = "choice"
choices = ["one-sided", "two-sided (long edge)", "two-sided (short edge)"]
default = "one-sided"

[[setting]]
key = "media"
label = "Paper"
kind = "choice"
choices = ["", "A4", "Letter", "A3", "Legal"]
default = ""
hint = "empty: the printer's own"

[[setting]]
key = "options"
label = "More lp options"
kind = "text"
hint = "added as they are, e.g. -o fit-to-page -o page-ranges=1-3"
