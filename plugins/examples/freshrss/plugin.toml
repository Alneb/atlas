# FreshRSS: the unread articles in a block; one into a note with a click. An example of a block fed by a JavaScript
# helper (FreshRSS's Fever API, its key a form field the core fills in) whose methods are tools too. Copy into a
# vault's .atlas/plugins/.
title = "FreshRSS"
description = "unread articles in a block, an article into a note"
phone = true # runs in the phone apps too (only plugins marked so start there)
icon = "globe"
version = "0.2.0"
api = 16

[helper]
js = "helper.js"   # run in the core (QuickJS): the same on every platform, the phone too
idle = "10m"

[[tool]]
name = "unread"
description = "The user's unread FreshRSS articles, newest first: id, title, url. Read-only."
input = { limit = "integer?" }

[[tool]]
name = "save"
description = "Save one FreshRSS article (an id from freshrss_unread) as a note in the reading folder; answers its path. An existing note is not written over."
input = { id = "string" }

[permissions]
net = ["*"]
secrets = true

[[setting]]
key = "server"
label = "FreshRSS address"
kind = "text"
hint = "https://rss.example.org"

[[setting]]
key = "api_key"
label = "Fever API key"
kind = "secret"
hint = "the md5 of \"user:API password\" (FreshRSS → Settings → Profile → API password)"

[[setting]]
key = "folder"
label = "Folder for saved articles"
kind = "text"
default = "notes/reading"

# where it runs (PLUGIN-API.md, "Platforms"); a platform not named is untested (Android: only with `phone = true`)
[platforms]
linux = "works"
