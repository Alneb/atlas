# Dependency updates: one grouped pull request per ecosystem a month (each pull request runs the whole CI), and only
# for versions a week old or more.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups: { cargo: { patterns: ["*"] } }
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups: { npm: { patterns: ["*"] } }
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups: { actions: { patterns: ["*"] } }
    open-pull-requests-limit: 1
