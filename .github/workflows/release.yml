# The packages: on Linux the AppImage, deb, rpm (Tauri's bundler) and a Flatpak (packaging/flatpak), plus the `atlas`
# CLI; on macOS an ad-hoc-signed .dmg, on Windows an NSIS installer (unsigned: docs/decisions/PORTING-windows-macos.md).
# A tag `v*` attaches them to a draft GitHub release for the maintainer to review and publish; a manual run, or CI
# calling this workflow on every push to main, keeps them as the run's artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libxkbcommon-dev libwayland-dev libssl-dev pkg-config build-essential rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: The UI
        run: npm --prefix ui ci --no-audit --no-fund && npm --prefix ui run build
      - name: The CLI
        run: cargo build --release --locked -p atlas && strip target/release/atlas
      # the same pinned bundler as CI's macOS and Windows packages
      - name: The desktop app's packages
        run: |
          cd crates/atlas-app
          npx --yes @tauri-apps/cli@2.12.4 build --ci --bundles appimage,deb,rpm --config '{"bundle":{"active":true}}'
      - name: Collect
        run: |
          mkdir -p dist
          cp target/release/atlas target/release/atlas-app dist/
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm dist/
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: dist/

  # the desktop app on the ports; the config beside tauri.conf.json picks each system's package
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: The UI
        run: npm --prefix ui ci --no-audit --no-fund && npm --prefix ui run build
      - name: The desktop app's package
        shell: bash
        run: |
          cd crates/atlas-app
          npx --yes @tauri-apps/cli@2.12.4 build --ci
      - uses: actions/upload-artifact@v6
        with:
          name: atlas-${{ runner.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: linux
          path: dist
      - run: chmod +x dist/atlas dist/atlas-app
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: atlas.flatpak
          manifest-path: packaging/flatpak/io.github.alneb.Atlas.yml
          cache-key: flatpak-${{ github.sha }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, flatpak, desktop]
    runs-on: ubuntu-24.04
    # only this job writes (the draft release); a caller such as CI then needs to grant nothing beyond reading
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/linux/atlas
            artifacts/linux/*.AppImage
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
            artifacts/**/atlas.flatpak
            artifacts/atlas-macOS/*.dmg
            artifacts/atlas-Windows/*.exe
