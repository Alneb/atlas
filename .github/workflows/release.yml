# A tag `v*`: every package (packages.yml), attached to a draft GitHub release for the maintainer to review and publish.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  packages:
    uses: ./.github/workflows/packages.yml
    with:
      release: true
    secrets: inherit

  publish:
    needs: packages
    runs-on: ubuntu-24.04
    # the only job that writes (the draft release)
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # an artifact keeps the folders below its paths' common root (atlas-macOS/dmg/…), hence the **; a pattern that
      # finds nothing fails the release instead of leaving a package out
      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
          files: |
            artifacts/linux/atlas
            artifacts/linux/*.AppImage
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
            artifacts/**/atlas.flatpak
            artifacts/atlas-macOS/**/*.dmg
            artifacts/atlas-Windows/**/*.exe
            artifacts/android-apks/**/*.apk
            artifacts/plugins/*.tar.gz
            artifacts/plugins/plugins.json
