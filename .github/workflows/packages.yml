# Every package, in one place: on Linux the AppImage, deb, rpm (Tauri's bundler) and a Flatpak (packaging/flatpak),
# plus the `atlas` CLI; on macOS an ad-hoc-signed .dmg, on Windows an NSIS installer (unsigned:
# docs/decisions/PORTING-windows-macos.md); the three Android APKs; the plugins as archives, their engines built
# for every desktop (scripts/dev/plugin-pack.mjs). CI calls it on every push and pull request (its
# artifacts), release.yml on a tag `v*` (the draft release); it can also be started by hand.
name: Packages

on:
  workflow_call:
    inputs:
      release:
        description: a release build (the APKs must then be signed with the project's key)
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/system-libs
        timeout-minutes: 15
        with:
          extra: rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: The UI
        run: npm --prefix ui ci --no-audit --no-fund && npm --prefix ui run build
      - name: The CLI
        run: cargo build --release --locked -p atlas && strip target/release/atlas
      # the same pinned bundler on every system
      - name: The desktop app's packages
        run: |
          cd crates/atlas-app
          npx --yes @tauri-apps/cli@2.12.4 build --ci --bundles appimage,deb,rpm --config '{"bundle":{"active":true}}'
      - name: Collect
        run: |
          mkdir -p dist
          cp target/release/atlas target/release/atlas-app dist/
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm dist/
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/

  # the desktop app on the ports; the config beside tauri.conf.json picks each system's package
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: The UI
        run: npm --prefix ui ci --no-audit --no-fund && npm --prefix ui run build
      - name: The desktop app's package
        shell: bash
        run: |
          cd crates/atlas-app
          npx --yes @tauri-apps/cli@2.12.4 build --ci
      - uses: actions/upload-artifact@v7
        with:
          name: atlas-${{ runner.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - run: chmod +x dist/atlas dist/atlas-app
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: atlas.flatpak
          manifest-path: packaging/flatpak/io.github.alneb.Atlas.yml
          cache-key: flatpak-${{ github.sha }}

  # every plugin's Rust engine, built on each desktop platform (scripts/dev/plugin-pack.mjs); a platform an engine
  # does not build on yet is reported (red) without holding the rest back: the archives say which platforms they carry
  plugin-engines:
    name: plugin engines (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on an old glibc (22.04), for the engines that cannot be static
          - { os: ubuntu-22.04, target: x86_64-linux, rust: "x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu" }
          - { os: ubuntu-22.04-arm, target: aarch64-linux, rust: "aarch64-unknown-linux-musl,aarch64-unknown-linux-gnu" }
          - { os: macos-latest, target: aarch64-macos, rust: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-macos, rust: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-windows, rust: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: engines-${{ matrix.target }}
          workspaces: |
            . -> target
            plugins/beta/dav/engine -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # musl's C compiler (ring, SQLite) and cmake (Tesseract, in the OCR engine)
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -o Acquire::http::Timeout=30 && sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 musl-tools cmake
        timeout-minutes: 10
      - name: The engines
        shell: bash
        run: node scripts/dev/plugin-pack.mjs engines --target ${{ matrix.target }} --keep-going
      # the marker keeps the artifact's root at plugins/ (an artifact keeps the paths below its files' common folder),
      # so it holds <tier>/<id>/bin/<target>/ even when one engine alone was built
      - name: Marker
        if: always()
        shell: bash
        run: echo "${{ matrix.target }}" > plugins/engines-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engines-${{ matrix.target }}
          path: |
            plugins/engines-${{ matrix.target }}.txt
            plugins/*/*/bin/${{ matrix.target }}/
          if-no-files-found: warn

  # one atlas-plugin-<id>.tar.gz per plugin, every platform's engine inside, and plugins.json
  plugins:
    needs: plugin-engines
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: engines-*
          merge-multiple: true
          path: bins
      - name: The archives
        run: node scripts/dev/plugin-pack.mjs pack --out target/dist/plugins --bins bins
      - uses: actions/upload-artifact@v7
        with:
          name: plugins
          path: target/dist/plugins/
          if-no-files-found: error

  android:
    name: android (the three APKs)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # the core carries the interface it serves
      - name: The UI
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build
      # the NDK, build-tools and a platform (checked against Google's sums), and PDFium for the PDF reader (pinned)
      - name: The toolchain
        run: |
          bash crates/atlas-android/get-toolchain.sh
          bash scripts/dev/fetch-pdfium.sh
      # The project's signing key, where build-apk.sh looks for one: an APK from any run then installs over the last.
      # Without the secret (a fork, a Dependabot pull request) the script makes a key for the run; a release refuses.
      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p local/toolchains && echo "$KEYSTORE" | base64 -d > local/toolchains/atlas-debug.keystore
            echo "signing with the project's key"
          elif [ "${{ inputs.release }}" = true ]; then
            echo "::error::a release needs the secret ANDROID_KEYSTORE_B64 (docs/guides/ANDROID.md, signing)"; exit 1
          else
            echo "::warning::no ANDROID_KEYSTORE_B64: the APKs are signed with a key made for this run"
          fi
      - name: The APKs
        run: bash crates/atlas-android/build-apk.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: target/dist/android/*.apk
          if-no-files-found: error
