# The gate on every push and pull request: the same `scripts/dev/gate.sh` a contributor runs locally, so "green" means
# one thing. Windows and macOS build every crate and run the core's tests; they may fail until those ports are done.
# Every package, the APKs included, comes from packages.yml, called here (job `packages`): a run keeps them as artifacts.
# scripts/dev/ci-annotate.mjs turns a failing step's errors and tests into annotations, readable without a sign-in.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # gate.sh runs itself in a memory-capped systemd scope on a desktop; a CI runner has none to spare
  ATLAS_HEAVY: "1"

jobs:
  gate:
    name: Gate (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/system-libs
        with:
          extra: musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Compiled crates kept between runs: saved also when tests fail (a red gate is still a full build), and only from
      # main, so pull requests read main's cache instead of filling the repository's 10 GB with copies of their own
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: What the vault scripts import beyond the standard library (PyYAML)
        run: python -m pip install --quiet pyyaml
      - name: UI dependencies
        run: npm --prefix ui ci --no-audit --no-fund
      # Playwright's Chromium kept between runs, keyed by the lock file (a new Playwright wants its own browser); on a
      # hit only its system libraries are checked (mostly on the runner already)
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - name: The browser the end-to-end tests use
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = true ]; then npx --prefix ui playwright install-deps chromium
          else npx --prefix ui playwright install --with-deps chromium; fi
      - name: Gate
        run: node scripts/dev/ci-annotate.mjs bash scripts/dev/gate.sh scan tidy rust clippy py ui build e2e
      - name: Gate logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-logs
          path: /tmp/atlas-gate/
          if-no-files-found: ignore

  port:
    name: Port (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # the desktop app embeds ui/dist at build time
      - name: The UI
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build
      - name: Build the core, the CLI and the capture box
        run: node scripts/dev/ci-annotate.mjs cargo build --locked -p atlas-core -p atlas -p atlas-capture -p atlas-app
      # Git for Windows' sh, Python and tar are on the runners: the tests that start them run here, unlike under Wine
      - name: The core's tests
        run: node scripts/dev/ci-annotate.mjs cargo test --locked -p atlas-core

  # every package (Linux, macOS, Windows, the APKs) as this run's artifacts
  packages:
    name: Packages
    uses: ./.github/workflows/packages.yml
    secrets: inherit
