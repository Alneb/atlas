# The gate on every push and pull request: the same `scripts/dev/gate.sh` a contributor runs locally, so "green" means
# one thing. Windows and macOS build every crate and run the core's tests; they may fail until those ports are done.
# Android builds the three APKs from the same toolchain scripts as a desktop (docs/guides/ANDROID.md).
# scripts/dev/ci-annotate.mjs turns a failing step's errors and tests into annotations, readable without a sign-in.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # gate.sh runs itself in a memory-capped systemd scope on a desktop; a CI runner has none to spare
  ATLAS_HEAVY: "1"

jobs:
  gate:
    name: Gate (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Tauri / WebKitGTK, the capture box's Wayland and D-Bus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libxkbcommon-dev libwayland-dev libssl-dev pkg-config build-essential musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: What the vault scripts import beyond the standard library (PyYAML)
        run: python -m pip install --quiet pyyaml
      - name: UI dependencies and the browsers the end-to-end tests use
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npx --prefix ui playwright install --with-deps chromium
      - name: Gate
        run: node scripts/dev/ci-annotate.mjs bash scripts/dev/gate.sh scan tidy rust clippy py ui build e2e
      - name: Gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: /tmp/atlas-gate/
          if-no-files-found: ignore

  port:
    name: Port (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # the desktop app embeds ui/dist at build time
      - name: The UI
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build
      - name: Build the core, the CLI, the desktop app and the capture box
        run: node scripts/dev/ci-annotate.mjs cargo build --locked -p atlas-core -p atlas -p atlas-app -p atlas-capture
      # Git for Windows' sh, Python and tar are on the runners: the tests that start them run here, unlike under Wine
      - name: The core's tests
        run: node scripts/dev/ci-annotate.mjs cargo test --locked -p atlas-core

  android:
    name: Android (the three APKs)
    runs-on: ubuntu-24.04
    # new: may fail while it settles; the APKs are the run's artifacts, signed with a key made for the run
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # the core carries the interface it serves
      - name: The UI
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build
      # the NDK, build-tools and a platform (checked against Google's sums), and PDFium for the PDF reader (pinned)
      - name: The toolchain
        run: |
          bash crates/atlas-android/get-toolchain.sh
          bash scripts/dev/fetch-pdfium.sh
      - name: The APKs
        run: bash crates/atlas-android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: target/dist/android/*.apk
          if-no-files-found: error
