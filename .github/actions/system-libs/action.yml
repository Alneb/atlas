# The Ubuntu libraries Atlas builds against (Tauri / WebKitGTK, the capture box's Wayland and D-Bus), in one place for
# every job. apt installs them as usual, but the .deb files it fetched are kept in the Actions cache, so a later run
# downloads only what changed. (A cached-packages action restored files instead of installing them, and lost
# glib-2.0.pc; this keeps apt doing the installing.)
name: System libraries
description: apt-get install of Atlas's build libraries, with the downloaded .debs cached between runs
inputs:
  extra:
    description: more packages for this job (space-separated)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: ~/.cache/apt-debs
        key: apt-debs-${{ runner.os }}-${{ hashFiles('.github/actions/system-libs/action.yml') }}-${{ inputs.extra }}
        restore-keys: apt-debs-${{ runner.os }}-
    - shell: bash
      run: |
        mkdir -p ~/.cache/apt-debs
        echo "[apt] $(ls ~/.cache/apt-debs | wc -l) cached .debs"
        sudo cp ~/.cache/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o APT::Keep-Downloaded-Packages=true \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
          libdbus-1-dev libxkbcommon-dev libwayland-dev libssl-dev pkg-config build-essential ${{ inputs.extra }}
        cp /var/cache/apt/archives/*.deb ~/.cache/apt-debs/ 2>/dev/null || true
        echo "[apt] $(ls ~/.cache/apt-debs | wc -l) .debs kept for the next run"
