[package]
name = "atlas-text"
description = "Pure helpers shared by the core and the plugin engines: frontmatter edits that keep the rest of a note byte for byte, the vault-path guard, iCalendar text, wall-clock times"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# No I/O beyond resolving a path, no core types: the core re-exports these, the engines (catalog-papers) link them,
# so one implementation serves both (docs/refactor/REFACTOR-references-plugin.md).
[dependencies]
serde_yaml = "0.9"
# wall_clock: the time types only (no clock, no zone database)
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
