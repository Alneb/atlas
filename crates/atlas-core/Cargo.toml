[package]
name = "atlas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Atlas workspace server: files, Today, capture, commands, search, events, pty over HTTP/WS"

[dependencies]
# what a pen stroke was meant as (/api/pen/shape): the phone's recognisers, shared
atlas-pen = { path = "../atlas-pen" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
atlas-text.workspace = true
atlas-template.workspace = true
tokio.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
toml = "0.9"
chrono = "0.4"
# "Export with marks": PDF annotations written into a copy (pdf_export.rs)
lopdf = { version = "0.46", default-features = false }
# PDF text for search, read in Rust (pdf_text.rs): no poppler needed
pdf_oxide = "0.3.78"
thiserror = "2"
walkdir = "2"
base64 = "0.22"
mime_guess = "2"
notify = "8"
portable-pty = "0.9"
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
schemars = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25.15"
serde_yaml = "0.9"
regex = "1"
# PDFium loaded at run time (src/pdfium.rs): covers here, the phone reader's pages, text, find and links
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "8", default-features = false, features = ["deflate"] } # an EPUB's cover (thumbs.rs), comics (convert.rs)
# comic archives and DjVu books made readable (convert.rs), pure Rust so the phone does it too
tar = "0.4"
flate2 = "1"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
djvu-rs = { version = "0.43", default-features = false, features = ["std", "pdf"] }
# JPEG XL thumbnails (src/thumbs.rs): pure Rust, so the phone's build needs no C either
jxl-oxide = "0.12"
reqwest = { workspace = true, features = ["blocking", "rustls-tls", "stream"] }
# server mode's sign-in (auth.rs): the password's Argon2id hash, SHA-256 of sessions and tokens
argon2 = "0.5"
sha2 = "0.10"
getrandom = "0.2"
# a helper's calls back go through the vault's router in-process (helper_api.rs): `oneshot` (axum already depends on it)
tower = { version = "0.5", features = ["util"] }
# gzip for what leaves the machine (server.rs `compress_gate`): the UI's scripts and the path listings
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
# the desktop's bridge to a vault on a server (remote_bridge.rs): its sockets piped through, wss with webpki roots
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
gix = { version = "0.90.0", default-features = false, features = ["status", "sha1", "revision", "blob-diff", "blame", "index"] }
# unified diffs of the in-process git reads (git_read.rs)
similar = "2"
# plugins' JavaScript helpers, run in the core (js_helper.rs): QuickJS, one context per plugin
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
# their heavy primitives, natively (js_native.rs): HTML selection, CSV
scraper = "0.27"
csv = "1"
# Typst (typst_doc.rs): ```typst fences as SVG, a vault .typ into a PDF (the Export plugin); fonts embedded + the machine's
typst = "0.15.1"
typst-layout = "0.15.1"
typst-svg = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["embedded-fonts", "scan-fonts"] }

# the few OS calls of platform/proc.rs (is a pid alive, the host name)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# rquickjs ships no prebuilt bindings for Android: generated there (libclang on the build machine, the NDK's sysroot)
# system notifications (notify.rs): the desktop's notification server over D-Bus, pure Rust
[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
zbus = "5"
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["std", "bindgen"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry"] }
# system notifications (notify.rs): toasts are WinRT; the same crate Tauri already brings in
windows = { version = "0.62", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications"] }

[dev-dependencies]
tempfile = "3"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress", "util"] } # a .cb7 made in a test
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
tokio-tungstenite = "0.28"
