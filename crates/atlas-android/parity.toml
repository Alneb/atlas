# How the phone does every feature of Atlas (docs/design/DESIGN-android-native-app.md §9), checked by
# `cargo test -p atlas-android --lib -- parity` (src/parity.rs). The features are found in the repository; this table
# only says, for each, how the Android app gets it:
#   "id" = "page"                      the WebView does it as on the desktop (reached through the app's Commands, its
#                                      bars, or the page's own view)
#   "id" = { native = "Class" }        a Java class of the app or of a plugin's android/ (the file must exist)
#   "id" = { missing = "why" }         not on the phone yet: allowed, listed on every run
# An inline table may add `note = "…"` (what is partly there, what is planned); a page line with a note is written
# `{ page = true, note = "…" }`. A pattern with `*` covers a whole family; an exact line wins over it. A test failure
# prints the lines to add or remove. "Unverified on the phone" means nobody has seen it work there yet: it is listed as
# missing until someone does.

