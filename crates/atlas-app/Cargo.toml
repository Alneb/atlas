[package]
name = "atlas-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Atlas desktop window: runs atlas-core in-process and points a webview at it"

[[bin]]
name = "atlas-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atlas-core.workspace = true
anyhow.workspace = true
tauri = { version = "2", features = [] }
# the system's folder dialog for opening or making a vault (main.rs; the core asks through vaults::on_pick_folder)
tauri-plugin-dialog = "2"
tokio = { workspace = true }
serde_json.workspace = true
serde.workspace = true
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
# the tray icon's pixels (main.rs `tray_pixels`), as atlas-capture reads its own
png = "0.17"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# a global key for the capture box while Atlas runs (main.rs `capture_key`): macOS has no desktop setting that gives a
# program a key, as KDE's shortcuts and a Windows Start-menu shortcut do
tauri-plugin-global-shortcut = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# the tray icon on Windows and macOS (tray_tauri.rs); Linux has its own (ksni below: Tauri's loads
# libayatana-appindicator at run time and panics without it)
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(target_os = "linux")'.dependencies]
# the tray icon: a StatusNotifierItem over D-Bus, pure Rust (tray_sni.rs). On async-io, not its default tokio:
# that feature turns on zbus's tokio backend for the whole build, and the core's blocking zbus calls (notify.rs) then
# panic on an async thread ("Cannot start a runtime from within a runtime")
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
# KDE's tablet mode followed over D-Bus (tablet.rs); the core's own zbus, blocking calls on a thread
zbus = "5"
# filter lists → WebKit content-blocker rules, for the browsing windows' ad blocking (web_filters.rs; moved out of the
# core, which the phone and the server build without needing it: REFACTOR-core-to-plugins.md #9)
adblock = { version = "0.13", features = ["content-blocking"] }
# the platform webview's settings (window.open without a fresh click; main.rs)
webkit2gtk = "2.0"
base64 = "0.22"   # a web tab's snapshot handed to the page as a data: URL (webtab.rs)
# the touchpad pinch caught before WebKit zooms the page with it (main.rs `pinch_to_wheel`)
gtk = "0.18"
# the web tabs' messages (webtab.rs): the page's posted strings
javascriptcore-rs = "1"
# WebKit's content filter store (browser.rs: ad blocking), which the Rust bindings do not cover
webkit2gtk-sys = { version = "2.0", features = ["v2_24"] }
gio-sys = "0.18"
glib-sys = "0.18"
gobject-sys = "0.18"
