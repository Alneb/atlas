[package]
name = "atlas-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Atlas's global quick-capture box: a native window (egui painted on the CPU), no web view, no GPU — it opens at once"

[lib]
path = "src/lib.rs"

[[bin]]
name = "atlas-capture"
path = "src/main.rs"
required-features = ["window"]

[features]
default = ["window"]
# the desktop's window; without it, only the capture logic the phone app shares (src/lib.rs)
window = ["dep:egui", "dep:egui-winit", "dep:winit", "dep:softbuffer", "dep:wayland-client", "dep:wayland-backend", "dep:dbus", "dep:rusqlite", "dep:png"]

[dependencies]
atlas-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
chrono = "0.4"
# the window without eframe: no GL to start (src/window.rs); egui painted on the CPU (src/raster.rs)
egui = { version = "0.29", optional = true, default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.29", optional = true, default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
softbuffer = { version = "0.4", optional = true, default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }
png = { version = "0.17", optional = true }

# Wayland's input region and the desktop's context over D-Bus (region.rs, context.rs): Linux only; elsewhere the box
# never floats and finds no context (docs/design/DESIGN-desktop-ports.md)
[target.'cfg(target_os = "linux")'.dependencies]
# the floating card's input region (src/region.rs), on winit's own Wayland connection
wayland-client = { version = "0.31", optional = true, default-features = false }
wayland-backend = { version = "0.3", optional = true, features = ["client_system", "dlopen"] }
# besides the text (src/context.rs): the window you were on (a KWin script calling back), what is playing
dbus = { version = "0.9", optional = true }
