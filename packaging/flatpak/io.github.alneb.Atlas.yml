# Atlas as a Flatpak, from binaries already built (the Release workflow's `linux` job puts them in ./dist):
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.alneb.Atlas.yml
# On a desktop, packaging/flatpak/build-local.sh compiles them inside the SDK first (the runtime's glibc) and installs.
# The GNOME runtime carries WebKitGTK 4.1, which the desktop app (Tauri) draws with.
app-id: io.github.alneb.Atlas
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: atlas-app
finish-args:
  - --share=network          # plugins' services, sync, the local core on 127.0.0.1
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --device=all             # a security key (FIDO2 over /dev/hidraw*) in the sign-in windows (crates/atlas-app webauthn.rs)
  - --filesystem=home        # vaults are ordinary folders, anywhere in the home folder
  - --filesystem=xdg-run/atlas:create  # the local key the `atlas` command signs in with, shared with the host's (auth.rs)
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --system-talk-name=org.freedesktop.login1   # whether the session is locked or idle (platform/idle.rs)
  # what a vault runs (plugin helpers, vault commands, atlas.exec, terminals, language servers) is the user's and
  # starts on the host with `flatpak-spawn --host` (crates/atlas-core/src/platform/host.rs)
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: atlas
    buildsystem: simple
    build-commands:
      - install -Dm755 atlas-app /app/bin/atlas-app
      - install -Dm755 atlas /app/bin/atlas
      - install -Dm755 atlas-capture /app/bin/atlas-capture
      # PDFium inside the sandbox (PDF covers, the PDF reader; pdfium.rs looks in <exe>/../lib/atlas): the pinned build
      # scripts/dev/fetch-pdfium.sh fetches, unpacked into pdfium/ by flatpak-builder (checked by its sum)
      - install -Dm644 pdfium/lib/libpdfium.so /app/lib/atlas/libpdfium.so
      - install -Dm644 io.github.alneb.Atlas.Capture.desktop /app/share/applications/io.github.alneb.Atlas.Capture.desktop
      - install -Dm644 io.github.alneb.Atlas.desktop /app/share/applications/io.github.alneb.Atlas.desktop
      - install -Dm644 io.github.alneb.Atlas.metainfo.xml /app/share/metainfo/io.github.alneb.Atlas.metainfo.xml
      - install -Dm644 atlas.svg /app/share/icons/hicolor/scalable/apps/io.github.alneb.Atlas.svg
    sources:
      - type: file
        path: ../../dist/atlas-app
      - type: file
        path: ../../dist/atlas
      - type: file
        path: ../../dist/atlas-capture
      - type: archive
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8086/pdfium-linux-x64.tgz
        sha256: 588577cf52dabc1a444988bac841920df54cc2f141801424de97ab04f4fbb935
        dest: pdfium
        strip-components: 0
      - type: file
        path: io.github.alneb.Atlas.Capture.desktop
      - type: file
        path: io.github.alneb.Atlas.desktop
      - type: file
        path: io.github.alneb.Atlas.metainfo.xml
      - type: file
        path: ../icon/atlas.svg
