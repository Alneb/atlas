<!-- The icon's glyph alone, white on transparent: Android's adaptive foreground and themed (monochrome) layer. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- the folded map, hidden behind the globe (a mask, not a filled cut-out: the glyph alone stays transparent there) -->
  <mask id="behind-globe" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
    <rect width="512" height="512" fill="#fff"/><circle cx="196" cy="196" r="121" fill="#000"/>
  </mask>
  <g mask="url(#behind-globe)" stroke="#fff" stroke-linejoin="round">
    <path d="M150 219 L246.7 196 L343.3 219 L440 196 L440 403 L343.3 426 L246.7 403 L150 426 Z" fill="#fff" fill-opacity=".18" stroke-width="18"/>
    <path d="M246.7 196 V403 M343.3 219 V426" stroke-width="9" stroke-opacity=".55"/>
    <circle cx="388" cy="366" r="22" fill="#fff" stroke="none"/>
  </g>
  <!-- the globe: outline, one meridian and the equator, tilted -->
  <circle cx="196" cy="196" r="112" fill="none" stroke="#fff" stroke-width="18"/>
  <g transform="rotate(-20 196 196)" fill="none" stroke="#fff" stroke-width="9" stroke-opacity=".55">
    <ellipse cx="196" cy="196" rx="47" ry="112"/><ellipse cx="196" cy="196" rx="112" ry="37"/>
  </g>
  <!-- the route from the globe to the note on the map -->
  <path d="M236 270 C290 340 330 360 388 366" fill="none" stroke="#fff" stroke-width="12" stroke-dasharray="1 26" stroke-linecap="round"/>
</svg>
